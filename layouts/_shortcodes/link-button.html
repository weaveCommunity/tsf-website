{{ $disabled := eq (lower (default "false" (.Get "disabled"))) "true" }}

<div class="link-button-wrap">
  {{ if $disabled }}
    <span
      class="btn link-button is-disabled"
      role="button"
      aria-disabled="true"
      tabindex="-1"
    >
      {{ .Get "text" | default "Register" }}
    </span>
  {{ else }}
    <a
      class="btn link-button"
      href="{{ .Get "link" }}"
      role="button"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ .Get "text" | default "Register" }}
    </a>
  {{ end }}
</div>

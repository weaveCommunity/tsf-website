media:
  input: static/uploads
  output: /uploads
  categories: [image]
  rename: safe

content:
  - name: pages
    label: Website pages
    type: collection
    path: content
    format: toml-frontmatter

    filename:
      template: "{primary}.md"
      field: true
      description: "Choose a short name without spaces, such as community-workshop."

    subfolders: true

    fields:
      - name: title
        label: Page title
        type: string
        description: "Title for your page. Will overlay the banner iamge."

      - name: banner
        label: Banner image
        type: image
        description: "A banner image for your page. Maximum 1320 x 528 resolution."

      - name: summary
        label: Summary
        type: text
        description: "An optional summary to be displayed on the list page."

      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown
          switcher: true

settings:
  content:
    merge: true